<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" href="houseart/marca/simbolo_color.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=block">
<link rel="stylesheet" href="houseart/ha-tokens.css">
<style>body{margin:0;background:#FBFAF7;-webkit-font-smoothing:antialiased}a{color:var(--ha-ink-900)}a:hover{color:var(--ha-ink-700)}*{box-sizing:border-box}button,input{font:inherit}@keyframes ha-spin{to{transform:rotate(360deg)}}</style>
</helmet>
<div data-screen-label="Entrar" style="min-height:100vh;display:flex;flex-wrap:wrap;font-family:var(--ha-font-ui);color:var(--ha-ink-900);background:var(--ha-paper-50)">

  <aside style="flex:1 1 420px;position:relative;overflow:hidden;background:var(--ha-ink-900);color:var(--ha-paper-50);display:flex;flex-direction:column;justify-content:space-between;gap:var(--ha-space-10);padding:var(--ha-space-10);min-height:320px">
    <div style="position:absolute;inset:0;background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Gallery_30,_National_Gallery_of_Art.jpg?width=1600');background-size:cover;background-position:center"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,15,.55),rgba(20,18,15,.9))"></div>
    <a href="HouseArt Home.dc.html" style="position:relative;display:flex;align-items:center;gap:var(--ha-space-2);color:var(--ha-paper-50);text-decoration:none"><img src="houseart/marca/marca_houseart_full_horiz_negativo.png" alt="houseArt" style="height:30px;width:auto;display:block;flex:none"></a>
    <div style="position:relative;display:flex;flex-direction:column;gap:var(--ha-space-4);max-width:460px">
      <h2 style="margin:0;font-family:var(--ha-font-display);font-weight:400;font-size:clamp(36px,4vw,56px);line-height:1.05">Sua coleção, <i>com escritura.</i></h2>
      <p style="margin:0;color:var(--ha-paper-200);text-wrap:pretty">Acompanhe ofertas, entregas e certificados das suas obras em um só lugar.</p>
    </div>
  </aside>

  <main style="flex:1 1 480px;display:flex;align-items:center;justify-content:center;padding:var(--ha-space-12) var(--ha-space-6)">
    <div style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:var(--ha-space-6)">
      <div style="display:flex;flex-direction:column;gap:var(--ha-space-2)">
        <h1 style="margin:0;font-family:var(--ha-font-display);font-weight:400;font-size:var(--ha-text-h1);line-height:1.1">Entrar</h1>
        <p style="margin:0;color:var(--ha-ink-500);font-size:var(--ha-text-body-sm)">Ainda não tem conta? <a href="HouseArt Cadastro.dc.html" style="font-weight:600">Criar conta</a></p>
      </div>

      <div style="display:flex;flex-direction:column;gap:var(--ha-space-2)">
        <button onClick="{{ entrarGoogle }}" style="cursor:pointer;display:flex;align-items:center;justify-content:center;gap:var(--ha-space-3);height:48px;border-radius:var(--ha-radius-md);border:1px solid #DADCE0;background:#fff;color:#1F1F1F;font-weight:500;font-size:var(--ha-text-body-sm)" style-hover="background:#F8F9FA">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
          Continuar com Google
        </button>
        <button onClick="{{ entrarApple }}" style="cursor:pointer;display:flex;align-items:center;justify-content:center;gap:var(--ha-space-3);height:48px;border-radius:var(--ha-radius-md);border:none;background:#000;color:#fff;font-weight:500;font-size:var(--ha-text-body-sm)" style-hover="background:#222">
          <svg width="17" height="20" viewBox="0 0 384 512" aria-hidden="true"><path fill="#fff" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"></path></svg>
          Continuar com Apple
        </button>
      </div>

      <div style="display:flex;align-items:center;gap:var(--ha-space-3);font-size:var(--ha-text-caption);color:var(--ha-ink-500)"><span style="flex:1;height:1px;background:var(--ha-paper-200)"></span>ou com e-mail e senha<span style="flex:1;height:1px;background:var(--ha-paper-200)"></span></div>

      <form onSubmit="{{ enviar }}" style="display:flex;flex-direction:column;gap:var(--ha-space-4)">
        <label style="display:flex;flex-direction:column;gap:var(--ha-space-2);font-size:var(--ha-text-body-sm);font-weight:600">E-mail ou CPF
          <input value="{{ email }}" onChange="{{ digitarEmail }}" autocomplete="username" placeholder="voce@email.com" style="height:48px;padding:0 var(--ha-space-3);border-radius:var(--ha-radius-sm);border:var(--ha-border-w) solid {{ bdEmail }};background:#fff;font-weight:400;outline:none" style-focus="border-color:var(--ha-ink-900)">
        </label>
        <label style="display:flex;flex-direction:column;gap:var(--ha-space-2);font-size:var(--ha-text-body-sm);font-weight:600">
          <span style="display:flex;justify-content:space-between;align-items:baseline">Senha<a href="#" onClick="{{ esqueci }}" style="font-weight:500;font-size:var(--ha-text-caption);color:var(--ha-ink-500)">Esqueci minha senha</a></span>
          <span style="position:relative;display:flex">
            <input type="{{ tipoSenha }}" value="{{ senha }}" onChange="{{ digitarSenha }}" autocomplete="current-password" placeholder="Sua senha" style="flex:1;height:48px;padding:0 48px 0 var(--ha-space-3);border-radius:var(--ha-radius-sm);border:var(--ha-border-w) solid {{ bdSenha }};background:#fff;font-weight:400;outline:none" style-focus="border-color:var(--ha-ink-900)">
            <button type="button" onClick="{{ alternarSenha }}" aria-label="Mostrar senha" style="cursor:pointer;position:absolute;right:4px;top:4px;width:40px;height:40px;border:none;background:none;color:var(--ha-ink-500);font-family:'Material Symbols Rounded';font-size:20px">{{ olho }}</button>
          </span>
        </label>
        <sc-if value="{{ temErro }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:var(--ha-space-2);align-items:flex-start;padding:var(--ha-space-3);border-radius:var(--ha-radius-sm);background:var(--ha-alert-100);color:var(--ha-alert-500);font-size:var(--ha-text-body-sm)"><span style="font-family:'Material Symbols Rounded';font-size:18px">error</span>{{ erro }}</div>
        </sc-if>
        <sc-if value="{{ temAviso }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:var(--ha-space-2);align-items:flex-start;padding:var(--ha-space-3);border-radius:var(--ha-radius-sm);background:var(--ha-verified-100);color:var(--ha-verified-500);font-size:var(--ha-text-body-sm)"><span style="font-family:'Material Symbols Rounded';font-size:18px">mark_email_read</span>{{ aviso }}</div>
        </sc-if>
        <label style="display:flex;gap:var(--ha-space-2);align-items:center;font-size:var(--ha-text-body-sm);color:var(--ha-ink-700)"><input type="checkbox" checked="{{ lembrar }}" onChange="{{ marcarLembrar }}" style="accent-color:#14120F;width:16px;height:16px">Manter conectado neste dispositivo</label>
        <button type="submit" style="cursor:pointer;height:52px;display:flex;align-items:center;justify-content:center;gap:var(--ha-space-2);font-weight:600;border-radius:var(--ha-radius-md);border:none;background:var(--ha-ink-900);color:var(--ha-paper-50)" style-hover="background:var(--ha-ink-700)">{{ spinner }}{{ btnTxt }}</button>
      </form>

      <p style="margin:0;font-size:var(--ha-text-caption);color:var(--ha-ink-500);text-wrap:pretty">Ao entrar, você concorda com os <a href="#" style="color:var(--ha-ink-700)">Termos de uso</a> e a <a href="#" style="color:var(--ha-ink-700)">Política de privacidade</a> da HouseArt.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', senha: '', ver: false, lembrar: true, erro: '', aviso: '', carregando: false };
  componentWillUnmount() { clearTimeout(this.t); }
  ir(msg) { this.setState({ carregando: true, erro: '', aviso: '', btn: msg }); clearTimeout(this.t); this.t = setTimeout(() => { location.href = 'HouseArt Web App.dc.html'; }, 1200); }
  renderVals() {
    const s = this.state;
    return {
      email: s.email, senha: s.senha,
      digitarEmail: (e) => this.setState({ email: e.target.value, erro: '' }),
      digitarSenha: (e) => this.setState({ senha: e.target.value, erro: '' }),
      tipoSenha: s.ver ? 'text' : 'password', olho: s.ver ? 'visibility_off' : 'visibility',
      alternarSenha: () => this.setState({ ver: !s.ver }),
      lembrar: s.lembrar, marcarLembrar: (e) => this.setState({ lembrar: e.target.checked }),
      esqueci: (e) => { e.preventDefault(); this.setState(s.email ? { aviso: 'Enviamos um link para redefinir a senha para ' + s.email + '.', erro: '' } : { erro: 'Digite seu e-mail para receber o link de redefinição.', aviso: '' }); },
      enviar: (e) => { e.preventDefault(); if (!s.email || !s.senha) return this.setState({ erro: 'Preencha e-mail e senha para entrar.' }); if (s.senha.length < 6) return this.setState({ erro: 'E-mail ou senha incorretos. Você tem mais 4 tentativas.' }); this.ir('Entrando…'); },
      entrarGoogle: () => this.ir('Conectando ao Google…'),
      entrarApple: () => this.ir('Conectando à Apple…'),
      temErro: !!s.erro, erro: s.erro, temAviso: !!s.aviso, aviso: s.aviso,
      bdEmail: s.erro && !s.email ? 'var(--ha-alert-500)' : 'var(--ha-paper-200)',
      bdSenha: s.erro && s.email ? 'var(--ha-alert-500)' : 'var(--ha-paper-200)',
      btnTxt: s.carregando ? s.btn : 'Entrar',
      spinner: s.carregando ? React.createElement('span', { style: { width: 18, height: 18, borderRadius: '50%', border: '2px solid rgba(255,255,255,.35)', borderTopColor: '#fff', animation: 'ha-spin 800ms linear infinite', display: 'block' } }) : null,
    };
  }
}
</script>
</body>
</html>
