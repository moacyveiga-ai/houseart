name: ci
on:
  pull_request: {}
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: houseart_test }
        ports: ['5436:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      DATABASE_URL: postgresql://postgres:postgres@localhost:5436/houseart_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5436/houseart_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run gate
      - run: npm run build
